<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - PDF Master Pro</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/upload.css">
</head>
<body>

<section class="upload-page">

    <h1>Create Account</h1>

    <div class="upload-box">

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <br><br>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit">
                Sign Up
            </button>

        </form>

    </div>

</section>

<script src="../js/signup.js"></script>

</body>
</html>
