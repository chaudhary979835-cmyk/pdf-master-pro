<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Split PDF</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/upload.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<section class="upload-page">

    <h1>Split PDF</h1>

    <p>Select a PDF and enter the page number to split.</p>

    <div class="upload-box">

        <i class="fa-solid fa-scissors"></i>

        <h2>Upload PDF</h2>

        <form id="splitForm" enctype="multipart/form-data">

            <input
                type="file"
                id="pdfFile"
                name="pdf"
                accept=".pdf"
                required
            >

            <br><br>

            <input
                type="number"
                id="splitPage"
                placeholder="Split after page..."
                min="1"
                required
            >

            <br><br>

            <button type="submit">
                Split PDF
            </button>

        </form>

    </div>

</section>

<script src="../js/split.js"></script>

</body>
</html>

<div id="splitDownloads"></div>
